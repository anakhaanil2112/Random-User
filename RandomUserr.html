<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <style>
        body {
            background-color: rgb(199, 180, 156);
        }

        h1 {
            margin: 10px;
            margin-top: 50px;
            color: black;
        }

        button {
            border: none;
            padding: 40px;
            background-color: rgb(25, 87, 87);
            border-radius: 3%;
            margin-top: 150px;
            margin-left: 700px;
            color: rgb(255, 248, 248);
            text-align: center;

        }

        #box {
            margin: 20px;
            padding: 20px;
            color: black;

        }

        h2 {
            color: black;
            text-align: center;
            margin-top: 20px;
        }
    </style>
    <title>Random User</title>
</head>

<body>
    <div>
        <h1 class="d-flex align-items-center justify-content-center">Random User Generator</h1>
        <button onclick="generate()">Generate</button>

    </div>
    <h2>The users:</h2>
    <div id="box">

    </div>
</body>
<script>
    async function generate() {
        try {
            let response = await fetch('https://randomuser.me/api/')
            // console.log(response);
            let data = await response.json()
            // console.log(data.results);
            data.results.forEach(user => {
            let card = document.createElement("div");
            card.innerHTML = `
                <div style="background-color: antiquewhite;margin-left: 570px;padding: 20px; width:300px ">
                <img src="${user.picture.large}">
                <h3>${user.name.first} ${user.name.last}</h3>
                <p>Email: ${user.email}</p>
                <p>Location: ${user.location.city}, ${user.location.country}</p>
                <p>Phone: ${user.phone}</p>
                div>`;

                box.appendChild(card);

            });
        }
        catch (error) {
            box.innerHTML = "Error fetching users";
        }



    }
</script>

</html>
